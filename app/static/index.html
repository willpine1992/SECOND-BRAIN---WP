<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Second Brain</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="toggleSidebar" class="icon-btn" title="Notas e Tags">📁</button>
    <div class="brand">🧠 Second Brain</div>
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Buscar notas, tags, conteúdo..." />
      <button id="searchBtn" class="icon-btn" title="Buscar">🔍</button>
    </div>
    <div class="topbar-actions">
      <button id="newNoteBtn" class="btn">+ Nota</button>
      <button id="dailyNoteBtn" class="btn">Diário de hoje</button>
      <button id="graphBtn" class="btn">Grafo</button>
      <button id="graphSettingsBtn" class="icon-btn hidden" title="Configurações do grafo">⚙</button>
      <button id="themeBtn" class="icon-btn" title="Alternar tema">◐</button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar" class="collapsed">
      <div class="sidebar-section">
        <div class="sidebar-title">Notas</div>
        <div id="tree" class="tree"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Tags</div>
        <div id="tagList" class="tag-list"></div>
      </div>
    </aside>

    <main id="main">
      <div id="emptyState" class="empty-state">
        <p>Selecione uma nota, crie uma nova, ou veja o grafo.</p>
      </div>

      <div id="editorView" class="hidden">
        <div class="editor-toolbar">
          <span id="notePath" class="note-path"></span>
          <a id="articleLinkBtn" class="btn hidden" target="_blank" rel="noopener noreferrer">🔗 Artigo</a>
          <div class="spacer"></div>
          <button id="modeEditBtn" class="tab-btn active">Editar</button>
          <button id="modePreviewBtn" class="tab-btn">Ler</button>
          <button id="saveBtn" class="btn primary">Salvar</button>
          <button id="deleteBtn" class="btn danger">Excluir</button>
        </div>
        <div class="editor-body">
          <textarea id="editorTextarea" spellcheck="false"></textarea>
          <div id="previewPane" class="preview hidden"></div>
        </div>
      </div>

      <div id="graphView" class="hidden">
        <svg id="graphSvg"></svg>
        <div id="graphSettingsPanel" class="graph-settings hidden">
          <div class="graph-settings-title">Configurações do grafo</div>

          <div class="gs-tabs">
            <button id="gsTabForca" class="gs-tab active" data-tab="forca">Força</button>
            <button id="gsTabTela" class="gs-tab" data-tab="tela">Tela</button>
            <button id="gsTabFiltros" class="gs-tab" data-tab="filtros">Filtros</button>
            <button id="gsTabGrupos" class="gs-tab" data-tab="grupos">Grupos</button>
          </div>

          <div id="gsPanelForca" class="gs-panel">
            <label class="gs-label">Força centrípeta <span id="gsCenterStrengthVal"></span></label>
            <input id="gsCenterStrength" type="range" min="0" max="2" step="0.1" />

            <label class="gs-label">Força de repulsão <span id="gsChargeStrengthVal"></span></label>
            <input id="gsChargeStrength" type="range" min="10" max="300" step="10" />

            <label class="gs-label">Força dos links <span id="gsLinkStrengthVal"></span></label>
            <input id="gsLinkStrength" type="range" min="0" max="1" step="0.05" />

            <label class="gs-label">Distância dos links <span id="gsLinkDistanceVal"></span></label>
            <input id="gsLinkDistance" type="range" min="10" max="150" step="5" />

            <label class="gs-label">Intensidade do movimento contínuo <span id="gsMovementVal"></span></label>
            <input id="gsMovement" type="range" min="0" max="1" step="0.05" />
          </div>

          <div id="gsPanelTela" class="gs-panel hidden">
            <label class="gs-label">Limite de visibilidade textual <span id="gsLabelThresholdVal"></span></label>
            <input id="gsLabelThreshold" type="range" min="0" max="20" step="1" />

            <label class="gs-label">Tamanho da fonte <span id="gsFontSizeVal"></span></label>
            <input id="gsFontSize" type="range" min="3" max="10" step="0.5" />

            <label class="gs-label">Tamanho dos círculos <span id="gsNodeSizeVal"></span></label>
            <input id="gsNodeSize" type="range" min="0.4" max="2" step="0.1" />

            <label class="gs-label">Grossura dos links <span id="gsLinkIntensityVal"></span></label>
            <input id="gsLinkIntensity" type="range" min="0.05" max="1" step="0.05" />
          </div>

          <div id="gsPanelFiltros" class="gs-panel hidden">
            <label class="gs-label">Tema</label>
            <select id="gsThemeFilter">
              <option value="">Todos os temas</option>
            </select>

            <label class="gs-label">Etiquetas <button id="gsSolarModeToggle" class="btn small"></button></label>
            <div id="gsTagFilter" class="gs-tag-filter"></div>

            <label class="gs-label">Notas de "Minhas Notas" <button id="gsMinhasNotasToggle" class="btn small"></button></label>
          </div>

          <div id="gsPanelGrupos" class="gs-panel hidden">
            <div class="graph-settings-subtitle">Grupos por palavra-chave</div>
            <div id="groupsList" class="groups-list"></div>
            <div class="group-form">
              <input id="groupName" type="text" placeholder="Nome do grupo" />
              <input id="groupKeyword" type="text" placeholder="Palavra-chave(s), separadas por vírgula" />
              <div class="group-form-row">
                <input id="groupColor" type="color" value="#4a6fa5" />
                <button id="groupAdd" class="btn">+ Adicionar grupo</button>
              </div>
            </div>
          </div>

          <button id="gsReset" class="btn" style="margin-top:12px;">Restaurar padrão</button>
        </div>
      </div>
    </main>

    <aside id="rightPanel">
      <div class="sidebar-section">
        <div class="sidebar-title">Frontmatter</div>
        <div id="frontmatterBox" class="meta-box">—</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Links de saída</div>
        <div id="outLinks" class="meta-box">—</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Backlinks</div>
        <div id="backLinks" class="meta-box">—</div>
      </div>
    </aside>
  </div>
</div>

<!-- New note modal -->
<div id="newNoteModal" class="modal hidden">
  <div class="modal-card">
    <h3>Nova nota</h3>
    <label>Pasta</label>
    <select id="newNoteFolder"></select>
    <label>Título</label>
    <input id="newNoteTitle" type="text" placeholder="Título da nota" />
    <label>Template</label>
    <select id="newNoteTemplate"></select>
    <div class="modal-actions">
      <button id="newNoteCancel" class="btn">Cancelar</button>
      <button id="newNoteCreate" class="btn primary">Criar</button>
    </div>
  </div>
</div>

<!-- Confirm / alert modal -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-card">
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button id="confirmCancel" class="btn">Cancelar</button>
      <button id="confirmOk" class="btn primary">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
