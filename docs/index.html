<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Second Brain (somente leitura)</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<div id="app">

  <div id="readonlyBanner">
    📖 Cópia somente leitura, publicada no GitHub Pages — pra editar, criar
    ou excluir notas, rode o app localmente
    (<a href="https://github.com/willpine1992/SECOND-BRAIN---WP" target="_blank" rel="noopener noreferrer">ver repositório</a>).
  </div>

  <header id="topbar">
    <button id="toggleSidebar" class="icon-btn" title="Alternar painel">☰</button>
    <div class="brand">🧠 Second Brain</div>
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Buscar notas, tags, conteúdo..." />
    </div>
    <div class="topbar-actions">
      <button id="graphBtn" class="btn">Grafo</button>
      <button id="graphSettingsBtn" class="icon-btn hidden" title="Configurações do grafo">⚙</button>
      <button id="themeBtn" class="icon-btn" title="Alternar tema">◐</button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Notas</div>
        <div id="tree" class="tree"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Tags</div>
        <div id="tagList" class="tag-list"></div>
      </div>
    </aside>

    <main id="main">
      <div id="emptyState" class="empty-state">
        <p>Selecione uma nota, ou veja o grafo.</p>
      </div>

      <div id="editorView" class="hidden">
        <div class="editor-toolbar">
          <span id="notePath" class="note-path"></span>
          <a id="articleLinkBtn" class="btn hidden" target="_blank" rel="noopener noreferrer">🔗 Artigo</a>
          <div class="spacer"></div>
          <button id="modeEditBtn" class="tab-btn">Fonte</button>
          <button id="modePreviewBtn" class="tab-btn active">Ler</button>
        </div>
        <div class="editor-body">
          <textarea id="editorTextarea" class="hidden" spellcheck="false" readonly></textarea>
          <div id="previewPane" class="preview"></div>
        </div>
      </div>

      <div id="graphView" class="hidden">
        <svg id="graphSvg"></svg>
        <div id="graphSettingsPanel" class="graph-settings hidden">
          <div class="graph-settings-title">Configurações do grafo</div>

          <label class="gs-label">Tamanho da fonte <span id="gsFontSizeVal"></span></label>
          <input id="gsFontSize" type="range" min="3" max="10" step="0.5" />

          <label class="gs-label">Tamanho dos círculos <span id="gsNodeSizeVal"></span></label>
          <input id="gsNodeSize" type="range" min="0.4" max="2" step="0.1" />

          <label class="gs-label">Intensidade das linhas <span id="gsLinkIntensityVal"></span></label>
          <input id="gsLinkIntensity" type="range" min="0.05" max="1" step="0.05" />

          <label class="gs-label">Tema</label>
          <select id="gsThemeFilter">
            <option value="">Todos os temas</option>
          </select>

          <label class="gs-label">Etiquetas</label>
          <div id="gsTagFilter" class="gs-tag-filter"></div>

          <button id="gsReset" class="btn" style="margin-top:10px;">Restaurar padrão</button>
        </div>
      </div>
    </main>

    <aside id="rightPanel">
      <div class="sidebar-section">
        <div class="sidebar-title">Frontmatter</div>
        <div id="frontmatterBox" class="meta-box">—</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Links de saída</div>
        <div id="outLinks" class="meta-box">—</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Backlinks</div>
        <div id="backLinks" class="meta-box">—</div>
      </div>
    </aside>
  </div>
</div>

<!-- Generic message modal (read-only mode has no confirm actions) -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-card">
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button id="confirmCancel" class="btn hidden">Cancelar</button>
      <button id="confirmOk" class="btn primary">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
